# Render Blueprint — deploys the SIA voice service (TTS + STT).
# In the Render dashboard: New + → Blueprint → point at THIS repo.
services:
  - type: web
    name: sia-voice
    runtime: docker
    dockerfilePath: ./Dockerfile
    # int8 model keeps RAM low. `standard` (2 GB) is comfortable; to fit the
    # 512 MB tiers also set WHISPER_MODEL=tiny (see the RAM notes in README.md).
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: KOKORO_MODEL
        value: kokoro-v1.0.int8.onnx
      - key: TTS_VOICE
        value: hf_alpha
      - key: TTS_LANG
        value: en-us
      - key: TTS_SPEED
        value: "0.9"
      # tiny keeps RAM low so Kokoro + Whisper fit together; use `base` for
      # better accuracy if you're on the 2 GB Standard plan.
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_COMPUTE
        value: int8
      # Pre-synthesize every knowledge-base answer into the disk cache at boot
      # (background thread, ~2-3 min on int8) so every answer the site actually
      # plays is served from disk in milliseconds. Set to "0" only if the
      # instance is too small to hold the models.
      - key: PREWARM
        value: "1"
      # Also load Whisper at boot (~200 MB resident) so the first mic press
      # isn't waiting on a model load. Set "0" on a 512 MB instance.
      - key: PREWARM_STT
        value: "1"
      # --- Knowledge base -------------------------------------------------
      # Grounded answering runs locally (Qwen2.5-1.5B on llama.cpp): no API key
      # and no per-request cost, but ~1 GB resident on top of the voice models.
      # Total footprint is ~1.5 GB, so `standard` (2 GB) is the smallest plan
      # that fits. Set KB_ENABLED=0 to drop it and serve the curated answers.
      - key: LLM_BACKEND
        value: local
      - key: KB_ENABLED
        value: "1"
      # bge-small-en-v1.5 is trained for question-to-passage search and measured
      # better recall than all-MiniLM-L6-v2 (47% vs 33%) on the eval set.
      - key: EMBED_MODEL
        value: bge
      # Lock this down to your site's origin(s) in production, comma-separated,
      # e.g. "https://your-site.vercel.app". "*" is fine while developing.
      - key: ALLOW_ORIGINS
        value: "*"
